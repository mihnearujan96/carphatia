        <h1>Festival KARPATHIA la Horezu, județul Vâlcea</h1>
        <p>
          KARPATHIA (Karpathia, Carpathia) este un festival de vară la Horezu, Vâlcea, cu house,
          nostalgia, disco și muzică electronică. Evenimentul are loc pe 8 august 2026 la The Park,
          Strada Nicolae Bălcescu 31, Horezu — la poalele Munților Căpățânii, în zona renumită
          pentru ceramica de Horezu, patrimoniu cultural imaterial UNESCO din 2012.
        </p>
        <h2>Evenimente de vară în Horezu</h2>
        <p>
          Festivalul Karpathia / Karpathia Mini Festival aduce sunet de grădină și scenă deschisă în
          Oltenia. Bilete festival Karpathia 2026: ambilet.ro. Cazări în Horezu și în zona
          festivalului disponibile pentru perioada 7–9 august.
        </p>
        <h2>Ceramică UNESCO și festival în Carpați</h2>
        <p>
          Horezu este capitala ceramicii tradiționale din România — olărit, târguri de ceramică și
          Mănăstirea Hurezi (UNESCO). KARPATHIA leagă festivalul de meșteșugul viu al zonei:
          house, nostalgia și ceramică într-o singură experiență de vară în Vâlcea.
        </p>
